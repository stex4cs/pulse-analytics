name: pulse

x-node-build: &node-build
  context: .
  dockerfile: Dockerfile.node

x-node-env: &node-env
  NODE_ENV: production
  TZ: UTC
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-pulse}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulse}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?postavi u .env}
  REDIS_URL: redis://redis:6379
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-pulse}
  POSTGRES_USER: ${POSTGRES_USER:-pulse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postavi u .env}
  PULSE_SITES: ${PULSE_SITES:-rs,hr,ba,si}
  PULSE_INTERNAL_DOMAINS: ${PULSE_INTERNAL_DOMAINS:-tvarenasport.com,tvarenasport.hr,tvarenasport.ba,tvarenasport.si}
  IP_HASH_SECRET: ${IP_HASH_SECRET:?postavi u .env}
  JWT_SECRET: ${JWT_SECRET:?postavi u .env}

services:
  # ── Skladiste ─────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-pulse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?postavi u .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./db/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./monitoring/clickhouse-prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEM:-12g}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postavi u .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Ingestion (2 instance iza nginx-a, sekcija 13.1) ──────────────────────
  ingest-1:
    build:
      <<: *node-build
      args:
        ENTRY: packages/ingest/src/server.js
    restart: unless-stopped
    environment:
      <<: *node-env
      INGEST_PORT: 8080
      INGEST_SPOOL_DIR: /var/lib/pulse/spool
      GEOIP_CITY_DB: /geoip/GeoLite2-City.mmdb
      INGEST_RATE_LIMIT_PER_MIN: ${INGEST_RATE_LIMIT_PER_MIN:-100}
    volumes:
      - spool-data:/var/lib/pulse/spool
      - ./geoip:/geoip:ro
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ingest-2:
    build:
      <<: *node-build
      args:
        ENTRY: packages/ingest/src/server.js
    restart: unless-stopped
    environment:
      <<: *node-env
      INGEST_PORT: 8080
      INGEST_SPOOL_DIR: /var/lib/pulse/spool
      GEOIP_CITY_DB: /geoip/GeoLite2-City.mmdb
      INGEST_RATE_LIMIT_PER_MIN: ${INGEST_RATE_LIMIT_PER_MIN:-100}
    volumes:
      - spool-data:/var/lib/pulse/spool
      - ./geoip:/geoip:ro
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Worker (skalabilan: docker compose up --scale worker=N) ───────────────
  worker:
    build:
      <<: *node-build
      args:
        ENTRY: packages/worker/src/worker.js
    restart: unless-stopped
    environment:
      <<: *node-env
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-1000}
      WORKER_FLUSH_MS: ${WORKER_FLUSH_MS:-5000}
      WORKER_METRICS_PORT: 9101
      INGEST_SPOOL_DIR: /var/lib/pulse/spool
    volumes:
      - spool-data:/var/lib/pulse/spool
    depends_on:
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  # ── Agregacije ────────────────────────────────────────────────────────────
  cron:
    build:
      <<: *node-build
      args:
        ENTRY: packages/cron/src/index.js
    restart: unless-stopped
    environment:
      <<: *node-env
      CRON_METRICS_PORT: 9102
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REPORT_FROM: ${REPORT_FROM:-pulse@tvarenasport.com}
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # ── Dashboard ─────────────────────────────────────────────────────────────
  api:
    build:
      <<: *node-build
      args:
        ENTRY: packages/api/src/server.js
    restart: unless-stopped
    environment:
      <<: *node-env
      API_PORT: 8081
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-8h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }

  # ── Ulaz ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./sdk/dist:/usr/share/nginx/html/sdk:ro
    depends_on:
      - ingest-1
      - ingest-2
      - api
      - dashboard

  # ── Monitoring ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  clickhouse-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  spool-data:
