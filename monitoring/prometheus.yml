global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pulse-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ['ingest-1:8080', 'ingest-2:8080']

  - job_name: pulse-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9101']

  - job_name: pulse-cron
    metrics_path: /metrics
    static_configs:
      - targets: ['cron:9102']

  - job_name: pulse-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8081']

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ['clickhouse:9363']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
