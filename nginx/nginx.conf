user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    server_tokens off;

    log_format pulse '$remote_addr - $status $request_time "$request" "$http_user_agent"';
    access_log /var/log/nginx/access.log pulse buffer=32k flush=5s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 512;

    # Peak tokom derbija: 2000 req/s burst (sekcija 4.3).
    # Ovo je zastita infrastrukture; fina granulacija po IP-u je u aplikaciji.
    limit_req_zone $binary_remote_addr zone=collect:20m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=600r/m;
    limit_req_status 429;

    upstream pulse_ingest {
        least_conn;
        server ingest-1:8080 max_fails=2 fail_timeout=10s;
        server ingest-2:8080 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    upstream pulse_api       { server api:8081;       keepalive 16; }
    upstream pulse_dashboard { server dashboard:3000; keepalive 16; }

    # ── Ingestion + SDK ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name pulse.tvarenasport.com;

        # U produkciji: redirect na 443 i TLS blok ispod
        # return 301 https://$host$request_uri;

        location /pulse.js {
            alias /usr/share/nginx/html/sdk/pulse.js;
            add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
            add_header Access-Control-Allow-Origin "*";
            gzip_static on;
        }

        location /collect {
            limit_req zone=collect burst=200 nodelay;

            proxy_pass http://pulse_ingest;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ingest uvek odgovara 204 - ne cekamo dugo
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /ab/ {
            proxy_pass http://pulse_ingest;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3s;
        }

        location /health {
            proxy_pass http://pulse_ingest;
            access_log off;
        }

        # Metrike se ne izlazu javno
        location /metrics { deny all; }
    }

    # ── Dashboard + API ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name analitika.tvarenasport.com;

        location /api/ {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://pulse_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://pulse_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /metrics { deny all; }
    }

    # ── TLS (ukljuciti kad su sertifikati na mestu) ──────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name pulse.tvarenasport.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_session_cache shared:SSL:10m;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #     ... iste location sekcije kao gore ...
    # }
}
